[package]
name = "gopher"
version = "0.1.0"
edition = "2024"
description = "A personal GitHub agent review inbox for the macOS menu bar"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "io-util", "macros", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.24"
tao = "0.37"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-user-notifications = "0.3"
objc2-service-management = "0.3"
block2 = "0.6"
png = "0.18"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
